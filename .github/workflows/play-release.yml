name: Publish Google Play tests

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: play-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: play-release
    env:
      MININETWORKS_UPLOAD_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
      MININETWORKS_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
      MININETWORKS_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
      PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      MININETWORKS_REVIEW_ACCESS_CODE: ${{ secrets.PLAY_REVIEW_ACCESS_CODE }}
      PLAY_ADMOB_APP_ID: ${{ vars.PLAY_ADMOB_APP_ID }}
      PLAY_ADMOB_INTERSTITIAL_ID: ${{ vars.PLAY_ADMOB_INTERSTITIAL_ID }}
      PLAY_ADMOB_REWARDED_ID: ${{ vars.PLAY_ADMOB_REWARDED_ID }}
      PLAY_CLOSED_TRACK: ${{ vars.PLAY_CLOSED_TRACK || 'alpha' }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate release configuration
        shell: bash
        run: |
          for name in MININETWORKS_UPLOAD_STORE_PASSWORD MININETWORKS_UPLOAD_KEY_ALIAS MININETWORKS_UPLOAD_KEY_PASSWORD PLAY_UPLOAD_KEYSTORE_BASE64 PLAY_SERVICE_ACCOUNT_JSON MININETWORKS_REVIEW_ACCESS_CODE PLAY_ADMOB_APP_ID PLAY_ADMOB_INTERSTITIAL_ID PLAY_ADMOB_REWARDED_ID; do
            if [[ -z "${!name}" ]]; then
              echo "Missing release secret or variable: $name" >&2
              exit 1
            fi
          done

      - name: Authenticate to Google Play
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Play API client
        run: python -m pip install 'google-api-python-client>=2,<3' 'google-auth>=2,<3'

      - name: Prepare signing key and version
        shell: bash
        run: |
          keyfile="$RUNNER_TEMP/mini-networks-upload.jks"
          printf '%s' "$PLAY_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$keyfile"
          chmod 600 "$keyfile"
          echo "MININETWORKS_UPLOAD_STORE_FILE=$keyfile" >> "$GITHUB_ENV"
          # docs/RELEASE.md 1: test builds get semantic * 1000 + (run_number mod 999); 999 is kept for the production
          # build of the same versionName. publish_play.py refuses a code that is not above every code on Play.
          echo "PLAY_BUILD_NUMBER=$((GITHUB_RUN_NUMBER % 999))" >> "$GITHUB_ENV"

      - name: Production builds refuse the reviewer code
        shell: bash
        run: |
          if ./gradlew --no-daemon -q help 2> "$RUNNER_TEMP/production-check.log"; then
            echo "A production configuration accepted MININETWORKS_REVIEW_ACCESS_CODE" >&2
            exit 1
          fi
          grep -q "MININETWORKS_REVIEW_ACCESS_CODE is set, but this is a production build" "$RUNNER_TEMP/production-check.log"

      - name: Test and build signed test bundle
        shell: bash
        run: |
          testing=("-Pmininetworks.channel=testing" "-Pmininetworks.buildNumber=$PLAY_BUILD_NUMBER")
          read -r code name < <(./gradlew --no-daemon -q "${testing[@]}" :app:printVersion | tail -n 1)
          echo "PLAY_VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "PLAY_VERSION_NAME=$name" >> "$GITHUB_ENV"
          ./gradlew --no-daemon testDebugUnitTest lintDebug bundleRelease "${testing[@]}" \
            "-Pmininetworks.admob.appId=$PLAY_ADMOB_APP_ID" \
            "-Pmininetworks.admob.interstitialId=$PLAY_ADMOB_INTERSTITIAL_ID" \
            "-Pmininetworks.admob.rewardedId=$PLAY_ADMOB_REWARDED_ID"

      - name: Publish to internal and closed testing
        env:
          PLAY_BUNDLE: app/build/outputs/bundle/release/app-release.aab
        run: python tools/publish_play.py
